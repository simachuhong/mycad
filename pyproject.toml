[project]
name = "mycad"
version = "0.1.0"
description = "MyCAD headless programmable CAD kernel (Phase 0 MVP)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MyCAD contributors" }]
requires-python = ">=3.12,<3.15"
# Phase 0 dependency surface:
# - build123d  : parametric geometry primitives, single exact pin (moss hegemon)
# - cadquery-ocp-novtk : OpenCascade python bindings; the `-novtk` flavor avoids
#   the Qt5/VTK GUI transitive closure (T1 forbids VTK/PySide6/CadQuery).
#   Pin to the 7.9.3.x patch stream because OCP 7.9.4 dropped TopoDS_Wire fixes
#   that build123d 0.11.1 depends on.
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk>=7.9.3.1.1,<7.9.4",
]

# PEP 735 group, not an extra: `uv tree --no-dev` only filters dependency
# groups, so the runtime-closure audit (NOTICE attribution, forbidden
# distributions) would otherwise see ruff/pytest/packaging as runtime deps.
[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "basedpyright==1.40.1",
    "pytest>=8",
    "pytest-cov>=5",
    # T9: the demo-plugin editable-install test builds the plugin with the
    # same backend as the main package; keep hatchling importable in the
    # dev venv so `pip install -e --no-build-isolation` works offline.
    "hatchling>=1.26",
    "editables>=0.6",
]

[project.scripts]
mycad = "mycad.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/typing/ holds deliberately-failing expect-error sources. The file
# names already miss the test_*.py pattern; this is the second belt.
addopts = "-ra --ignore=tests/typing"
filterwarnings = [
    "error",
    # pytest-asyncio/uvloop virtualenv paths are noisy under strict warning config.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
line-length = 100
# `.omo/` carries plan / evidence / review archaeology from earlier Codex
# CLI runs; not part of the source tree under MyCAD's strict gates.
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".git",
    ".omo",
]

[tool.ruff.lint]
# Conservative Phase 0 rule set: catch dead code, pyupgrade, and obvious bugs.
# Do NOT add per-file ignores — T1 invariant is one rule set for whole tree.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
# Two carve-outs, both forced by something the plan pins verbatim.
ignore = [
    # The only over-long lines are canonical CLI command lines quoted in a
    # docstring and a script fixture. The grammar is one command per line,
    # so wrapping them would make them wrong.
    "E501",
    # The plan's 15-exception taxonomy names InvalidPlanTransition without
    # an Error suffix, and tests/test_exceptions.py locks the name set.
    "N818",
]
# PT (flake8-pytest-style) and PL (pylint) from the plan's original rule
# list are NOT enabled: PL alone reports 138 findings, 103 of them
# PLR2004 on assertions like `== 8` that are the point of the test. See
# .omo/evidence/final-2-phase0-mvp.md for the recorded deviation.

[tool.ruff.lint.isort]
known-first-party = ["mycad"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
