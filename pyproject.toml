[project]
name = "mycad"
version = "0.1.0"
description = "MyCAD programmable CAD kernel with a PySide6 desktop shell (Phase 1)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MyCAD contributors" }]
requires-python = ">=3.12,<3.15"
# Dependency surface:
# - build123d  : parametric geometry primitives, single exact pin (moss hegemon)
# - cadquery-ocp-novtk : OpenCascade python bindings; the `-novtk` flavor keeps
#   the VTK/CadQuery transitive closure out.
#   Pin to the 7.9.3.x patch stream because OCP 7.9.4 dropped TopoDS_Wire fixes
#   that build123d 0.11.1 depends on.
# - PySide6 + pyqtgraph : optional phase-1 desktop shell (`desktop` extra),
#   imported only in src/mycad/ui/ (see tests/test_scope_audit.py). VTK stays
#   forbidden, CadQuery stays forbidden, and mycad.core imports none of these.
#
# pyrightconfig.json stubPath=typings: hand-written pyqtgraph stubs are
# declarations of an existing runtime API (no official py.typed) — the
# E501/N818-style documented carve-out, not a suppression mechanism.
# Matches the lock range pyqtgraph>=0.13,<0.14 (no GLLineSegmentItem yet;
# wireframe edges = GLLinePlotItem(mode="lines")).
# typings/: pyi-only third-party API mirrors; pyright only (ruff's N802/N803
# would re-flag mirrored camelCase — exclude, keep the one-ruleset intact).
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk>=7.9.3.1.1,<7.9.4",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13,<0.14",
    # pyqtgraph only suggests PyOpenGL, but imports it in pyqtgraph.opengl
    # (the GLViewWidget the viewport builds on) — declare it explicitly so
    # the closure cannot silently drift away from what the shell imports.
    "PyOpenGL>=3.1,<4",
    # ezdxf's SVG drawing frontend imports Pillow; preview is desktop-only.
    "pillow>=12,<13",
    # Preserve exact sheet size and Unicode extraction after Qt vector PDF output.
    "pypdf==6.10.0",
]
# PlaneGCS is an optional geometry backend. Keep it isolated from the core
# runtime and avoid source builds on aarch64 until its T2 matrix is verified.
sketch-constraints = [
    "planegcs==0.9.6; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]

# PEP 735 group, not an extra: dev tools must stay out of both the default
# and desktop runtime exports used by NOTICE/scope audits.
[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "basedpyright==1.40.1",
    "pytest>=8",
    "pytest-cov>=5",
    # T9: the demo-plugin editable-install test builds the plugin with the
    # same backend as the main package; keep hatchling importable in the
    # dev venv so `pip install -e --no-build-isolation` works offline.
    "hatchling>=1.26",
    "editables>=0.6",
    # Phase-1 shell tests drive Qt widgets offscreen through pytest-qt.
    "pytest-qt>=4.4",
]

[project.scripts]
mycad = "mycad.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/typing/ holds deliberately-failing expect-error sources. The file
# names already miss the test_*.py pattern; this is the second belt.
addopts = "-ra --ignore=tests/typing"
filterwarnings = [
    "error",
    # pytest-asyncio/uvloop virtualenv paths are noisy under strict warning config.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
line-length = 100
# `.omo/` carries plan / evidence / review archaeology from earlier Codex
# CLI runs; not part of the source tree under MyCAD's strict gates.
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".git",
    ".omo",
    "typings",
]

[tool.ruff.lint]
# Conservative Phase 0 rule set: catch dead code, pyupgrade, and obvious bugs.
# Do NOT add per-file ignores — T1 invariant is one rule set for whole tree.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
# Two carve-outs, both forced by something the plan pins verbatim.
ignore = [
    # The only over-long lines are canonical CLI command lines quoted in a
    # docstring and a script fixture. The grammar is one command per line,
    # so wrapping them would make them wrong.
    "E501",
    # The plan's 15-exception taxonomy names InvalidPlanTransition without
    # an Error suffix, and tests/test_exceptions.py locks the name set.
    "N818",
]
# PT (flake8-pytest-style) and PL (pylint) from the plan's original rule
# list are NOT enabled: PL alone reports 138 findings, 103 of them
# PLR2004 on assertions like `== 8` that are the point of the test. See
# .omo/evidence/final-2-phase0-mvp.md for the recorded deviation.

[tool.ruff.lint.isort]
known-first-party = ["mycad"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
