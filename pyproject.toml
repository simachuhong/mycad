[project]
name = "mycad"
version = "0.1.0"
description = "MyCAD headless programmable CAD kernel (Phase 0 MVP)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MyCAD contributors" }]
requires-python = ">=3.12,<3.15"
# Phase 0 dependency surface:
# - build123d  : parametric geometry primitives, single exact pin (moss hegemon)
# - cadquery-ocp-novtk : OpenCascade python bindings; the `-novtk` flavor avoids
#   the Qt5/VTK GUI transitive closure (T1 forbids VTK/PySide6/CadQuery).
#   Pin to the 7.9.3.x patch stream because OCP 7.9.4 dropped TopoDS_Wire fixes
#   that build123d 0.11.1 depends on.
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk>=7.9.3.1.1,<7.9.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "basedpyright==1.40.1",
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # pytest-asyncio/uvloop virtualenv paths are noisy under strict warning config.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
line-length = 100
# `.omo/` carries plan / evidence / review archaeology from earlier Codex
# CLI runs; not part of the source tree under MyCAD's strict gates.
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".git",
    ".omo",
]

[tool.ruff.lint]
# Conservative Phase 0 rule set: catch dead code, pyupgrade, and obvious bugs.
# Do NOT add per-file ignores — T1 invariant is one rule set for whole tree.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line length (handled by formatter + CI; not a correctness gate)
]

[tool.ruff.lint.isort]
known-first-party = ["mycad"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"