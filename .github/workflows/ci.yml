name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: quality (3-OS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GL offscreen libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libglib2.0-0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra desktop --extra sketch-constraints
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest -q --junitxml=test-results.xml
      - name: Report failing tests as annotations
        if: always()
        run: uv run python scripts/report_junit_failures.py test-results.xml

  headless:
    name: headless runtime (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync base runtime only
        run: uv sync --frozen --no-dev
      - name: Validate and run the flange plan without desktop dependencies
        run: uv run --no-sync python scripts/verify_headless_install.py
